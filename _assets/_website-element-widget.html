<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmación RSVP</title>
  <style>
    @font-face {
      font-family: 'Cormorant Local';
      src: url('/ivory-photo-booth-wedding-website/_assets/fonts/003e82bf2f68067801da6a72d24cdf78.woff') format('woff');
      font-display: swap;
    }
    @font-face {
      font-family: 'Montserrat Local';
      src: url('/ivory-photo-booth-wedding-website/_assets/fonts/238919b47920553d7b287ec007d67e76.woff') format('woff');
      font-display: swap;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: transparent;
      font-family: 'Montserrat Local', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #3e3721;
      padding: 8px 10px 12px 10px; overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100%;
    }
    .form-card {
      width: 92%;
      max-width: 460px;
      background: transparent;
      padding: 2px;
      transform: scale(1.08);
      transform-origin: top center;
    }
    .header-area {
      text-align: center;
      margin-bottom: 20px;
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #815e40;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .main-title {
      font-family: 'Cormorant Local', Georgia, serif;
      font-size: 42px;
      line-height: 1.08;
      color: #5b5232;
      font-weight: 400;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }
    .main-title .cursive {
      font-style: italic;
      color: #5b5232;
      font-weight: 500;
    }
    .subtitle {
      color: #726744;
      font-style: italic;
      font-family: 'Cormorant Local', Georgia, serif;
      font-size: 17.5px;
      line-height: 1.35;
    }
    .field-group {
      margin-bottom: 14px;
    }
    .field-label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #5b5232;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .field-row {
      display: flex;
      gap: 12px;
    }
    .field-col {
      flex: 1;
      min-width: 0;
    }
    input[type="text"],
    select,
    textarea {
      width: 100%;
      background: #faf8f5;
      border: 1px solid #d5cdbf;
      border-radius: 4px;
      padding: 12px 14px;
      font-size: 14px;
      color: #3e3721;
      font-family: 'Montserrat Local', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    }
    input[type="text"]::placeholder,
    textarea::placeholder {
      color: #a39b8b;
      font-size: 13px;
    }
    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      border-color: #5b5232;
      box-shadow: 0 0 0 3px rgba(91, 82, 50, 0.15);
      background: #ffffff;
    }
    textarea {
      resize: vertical;
      min-height: 64px;
      line-height: 1.4;
    }
    .btn-submit {
      width: 100%;
      background: #5b5232;
      color: #f7f1e1;
      border: 1px solid #484125;
      border-radius: 4px;
      padding: 13px 22px;
      font-family: 'Montserrat Local', sans-serif;
      font-size: 12px;
      letter-spacing: 0.18em;
      font-weight: 600;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 3px 10px rgba(91, 82, 50, 0.22);
      margin-top: 4px;
    }
    .btn-submit:hover {
      background: #463e26;
      box-shadow: 0 5px 14px rgba(91, 82, 50, 0.32);
    }
    .btn-submit:active {
      transform: scale(0.99);
      background: #36301d;
    }
    .btn-submit svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }
    .alert-box {
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 4px;
      font-size: 12.5px;
      display: none;
      text-align: center;
      line-height: 1.4;
    }
    .alert-error {
      background: #fdf2f2;
      border: 1px solid #e8bebe;
      color: #782626;
    }
    .alert-success {
      background: #f4f2ec;
      border: 1px solid #cfc7b6;
      color: #5b5232;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <div class="header-area">
      <div class="eyebrow">Confirma tu asistencia</div>
      <h1 class="main-title">¿<span class="cursive">Nos acompañas</span>?</h1>
      <p class="subtitle">Completa tus datos y envíanos la confirmación por WhatsApp.</p>
    </div>

    <form id="rsvpWhatsappForm" novalidate>
      <div class="field-group">
        <label class="field-label" for="nombreInput">Nombre Completo</label>
        <input type="text" id="nombreInput" name="nombre" placeholder="Tu nombre y apellido" required autocomplete="name">
      </div>

      <div class="field-group">
        <div class="field-row">
          <div class="field-col">
            <label class="field-label" for="asistenciaSelect">¿Asistirás?</label>
            <select id="asistenciaSelect" name="asistencia" required>
              <option value="" disabled selected>Selecciona</option>
              <option value="si">Sí, asistiré</option>
              <option value="no">No podré asistir</option>
            </select>
          </div>
          <div class="field-col">
            <label class="field-label" for="acompanantesSelect">Acompañantes</label>
            <select id="acompanantesSelect" name="acompanantes">
              <option value="0" selected>Solo yo (0)</option>
              <option value="1">+1 acompañante</option>
              <option value="2">+2 acompañantes</option>
              <option value="3">+3 acompañantes</option>
              <option value="4">+4 acompañantes</option>
            </select>
          </div>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="mensajeInput">Mensaje o Bendición</label>
        <textarea id="mensajeInput" name="mensaje" placeholder="Unas palabras para los novios..."></textarea>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <span>Confirmar por WhatsApp</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L19 5M19 5H9M19 5V15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </button>

      <div id="alertBox" class="alert-box"></div>
    </form>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN: Número de WhatsApp destino
    // ==========================================
    const WHATSAPP_NUMERO = "51987654321"; 

    const form = document.getElementById('rsvpWhatsappForm');
    const alertBox = document.getElementById('alertBox');
    const btn = document.getElementById('btnSubmit');

    function showAlert(msg, isError) {
      alertBox.textContent = msg;
      alertBox.className = 'alert-box ' + (isError ? 'alert-error' : 'alert-success');
      alertBox.style.display = 'block';
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const nombre = document.getElementById('nombreInput').value.trim();
      const asistencia = document.getElementById('asistenciaSelect').value;
      const acompanantes = document.getElementById('acompanantesSelect').value;
      const mensaje = document.getElementById('mensajeInput').value.trim();

      if (!nombre) {
        showAlert('Por favor, ingresa tu nombre completo.', true);
        document.getElementById('nombreInput').focus();
        return;
      }

      if (!asistencia) {
        showAlert('Por favor, selecciona si asistirás al evento.', true);
        document.getElementById('asistenciaSelect').focus();
        return;
      }

      const txtAsistencia = asistencia === 'si' ? '¡Sí, confirmo mi asistencia! 💍' : 'Lamentablemente no podré asistir 🤍';
      const txtAcomp = asistencia === 'si' 
        ? (acompanantes === '0' ? 'Iré solo/a (0)' : `+${acompanantes} acompañante(s)`)
        : 'N/A';

      // Construir mensaje de WhatsApp sin depender de una API o base de datos.
      let msgWhatsApp = `¡Hola! Confirmo mi asistencia para la boda:\n\n`;
      msgWhatsApp += `*Nombre:* ${nombre}\n`;
      msgWhatsApp += `*¿Asistirá?:* ${txtAsistencia}\n`;
      if (asistencia === 'si') {
        msgWhatsApp += `*Acompañantes:* ${txtAcomp}\n`;
      }
      if (mensaje) {
        msgWhatsApp += `*Mensaje:* ${mensaje}\n`;
      }
      try {
        const invite = window.parent && window.parent.demo3Invitation;
        if (invite && invite.seats) msgWhatsApp += `*Cupos reservados en la invitación:* ${invite.seats}\n`;
      } catch (error) {}

      showAlert('¡Datos validados! Abriendo WhatsApp para enviar la confirmación...', false);

      const encodedText = encodeURIComponent(msgWhatsApp);
      const urlWhatsApp = `https://api.whatsapp.com/send?phone=${WHATSAPP_NUMERO}&text=${encodedText}`;

      setTimeout(() => {
        if (window.top && window.top !== window.self) {
          window.top.location.href = urlWhatsApp;
        } else {
          window.location.href = urlWhatsApp;
        }
      }, 700);
    });
  </script>
</body>
</html>
