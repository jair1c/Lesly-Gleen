<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Confirmación RSVP</title>
  <link rel="stylesheet" href="_assets/css/demo3-enhancements.css?v=20260924f">
  <style>
    :root{--ink:#5b5232;--paper:#f4f0e8;--line:#b9ad98;--ok:#667455;--error:#934b43}
    *{box-sizing:border-box}
    html,body{overflow:hidden}
    body{margin:0;padding:12px;color:var(--ink);background:transparent;font-family:"Demo3 Text",Georgia,serif}
    .card{padding:28px 26px 30px;background:rgba(248,245,238,.98);border:1px solid rgba(91,82,50,.25);box-shadow:0 9px 24px rgba(50,43,29,.09)}
    .eyebrow{text-align:center;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
    .title{margin:8px 0 12px;text-align:center;font:italic 400 43px/1.05 "Demo3 Serif",Georgia,serif}
    .subtitle{margin:0 auto 22px;max-width:38ch;text-align:center;font-size:15px;line-height:1.55}
    .summary{margin:0 0 18px;padding:14px 16px;text-align:center;background:#eae5da;border:1px solid rgba(91,82,50,.14);font-size:14px;line-height:1.5}
    .summary strong{display:block;font-size:18px}
    .field{margin-top:15px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    label{display:block;margin-bottom:7px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    input,select,textarea{width:100%;min-height:50px;padding:14px;color:#433c28;background:#fffdf9;border:1px solid var(--line);border-radius:0;font:16px/1.35 "Demo3 Text",Georgia,serif}
    input[readonly]{color:#5b5232;background:#eee9df}
    input:disabled,select:disabled{color:#766f5c;background:#eee9df;opacity:.78;cursor:not-allowed}
    textarea{min-height:88px;resize:vertical}
    .attendees{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .attendees .field{margin-top:12px}
    .submit{width:100%;min-height:56px;margin-top:20px;padding:15px 18px;color:#fff;background:var(--ink);border:1px solid var(--ink);font:700 11px/1.3 "Demo3 Text",Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
    .submit:disabled{opacity:.55;cursor:wait}
    .alert{display:none;margin-top:14px;padding:12px;text-align:center;font-size:14px;line-height:1.45}
    .alert.success{display:block;color:#fff;background:var(--ok)}
    .alert.error{display:block;color:#fff;background:var(--error)}
    .saved{margin-top:11px;text-align:center;font-size:13px;font-style:italic}
    .hidden{display:none!important}
    @media(max-width:430px){body{padding:8px}.card{padding:23px 18px 26px}.row,.attendees{grid-template-columns:1fr}.title{font-size:38px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Confirma tu asistencia</div>
    <h1 class="title">¿Nos acompañas?</h1>
    <p class="subtitle">Registra tu respuesta y envíanos también la confirmación por WhatsApp.</p>
    <div class="summary hidden" id="inviteSummary"><span>Invitación para</span><strong id="summaryName"></strong><span id="summarySeats"></span></div>
    <form id="rsvpForm" novalidate>
      <div class="field"><label for="invitationName">Invitación para</label><input id="invitationName" autocomplete="name" placeholder="Tu nombre y apellido" required></div>
      <div class="row">
        <div class="field"><label for="attendance">¿Asistirás?</label><select id="attendance" required><option value="" selected disabled>Selecciona</option><option value="si">Sí, asistiré</option><option value="no">No podré asistir</option></select></div>
        <div class="field" id="peopleWrap"><label for="people">Personas que asistirán</label><select id="people" disabled><option value="1">1 persona</option></select></div>
      </div>
      <div class="attendees" id="attendeeFields"></div>
      <div class="field"><label for="message">Mensaje o bendición</label><textarea id="message" maxlength="500" placeholder="Unas palabras para los novios…"></textarea></div>
      <button class="submit" id="submitButton" type="submit">Guardar y confirmar por WhatsApp</button>
      <div class="alert" id="alertBox" role="status"></div><div class="saved hidden" id="savedNote">Puedes actualizar tu respuesta hasta la fecha límite.</div>
    </form>
  </main>
  <script>
    const form=document.getElementById('rsvpForm'),attendance=document.getElementById('attendance'),people=document.getElementById('people'),peopleWrap=document.getElementById('peopleWrap'),fields=document.getElementById('attendeeFields'),nameInput=document.getElementById('invitationName'),messageInput=document.getElementById('message'),submitButton=document.getElementById('submitButton'),alertBox=document.getElementById('alertBox'),card=document.querySelector('.card');let invitation=null,resizeFrame=0;
    function reportHeight(){cancelAnimationFrame(resizeFrame);resizeFrame=requestAnimationFrame(()=>{const height=Math.ceil(card.getBoundingClientRect().height+24);window.parent.postMessage({type:'demo3:rsvp-height',height},location.origin)})}
    function alertMessage(text,error=false){alertBox.textContent=text;alertBox.className='alert '+(error?'error':'success')}
    function parentToken(){try{const direct=new URLSearchParams(window.parent.location.search).get('invite')||window.parent.demo3InviteToken||sessionStorage.getItem('demo3InviteToken')||'';if(direct)sessionStorage.setItem('demo3InviteToken',direct);return direct}catch(_){try{return sessionStorage.getItem('demo3InviteToken')||''}catch(__){return''}}}
    function getParentInvitation(){try{return window.parent&&window.parent.demo3Invitation||null}catch(_){return null}}
    function setPeopleOptions(max,selected){people.innerHTML='';for(let count=1;count<=max;count++){const option=document.createElement('option');option.value=String(count);option.textContent=count+(count===1?' persona':' personas');people.appendChild(option)}people.value=String(Math.min(Math.max(Number(selected)||1,1),max))}
    function renderAttendees(existing=[]){fields.innerHTML='';fields.classList.remove('hidden');const enabled=attendance.value==='si',count=Number(people.value)||1;for(let index=0;index<count;index++){const group=document.createElement('div');group.className='field';const label=document.createElement('label');label.htmlFor='attendee-'+index;label.textContent=index===0?'Nombre del asistente principal':`Nombre del acompañante ${index}`;const input=document.createElement('input');input.id='attendee-'+index;input.className='attendee-name';input.maxLength=120;input.required=enabled;input.disabled=!enabled;input.placeholder=enabled?'Nombre y apellido':'Disponible al confirmar asistencia';input.value=index===0?nameInput.value:(existing[index]||'');if(index===0){input.readOnly=true;input.setAttribute('aria-readonly','true');input.title='Este nombre fue definido en la invitación y no puede editarse.'}group.append(label,input);fields.appendChild(group)}}
    function applyInvitation(value){invitation=value;if(!value)return;nameInput.value=value.names||value.nombre||'';nameInput.readOnly=true;document.getElementById('summaryName').textContent=nameInput.value;document.getElementById('summarySeats').textContent=`Hemos reservado ${value.seats} ${Number(value.seats)===1?'cupo':'cupos'} para esta invitación.`;document.getElementById('inviteSummary').classList.remove('hidden');setPeopleOptions(Number(value.seats)||1,1);const r=value.rsvp;if(r){attendance.value=r.attendance?'si':'no';setPeopleOptions(Number(value.seats)||1,r.attendeeCount||1);messageInput.value=r.message||'';renderAttendees(r.attendeeNames||[]);document.getElementById('savedNote').classList.remove('hidden')}else renderAttendees([]);toggleAttendance()}
    function toggleAttendance(){const yes=attendance.value==='si';people.disabled=!yes;renderAttendees(Array.from(document.querySelectorAll('.attendee-name')).map(input=>input.value))}
    async function waitForInvitation(){const token=parentToken();if(token){try{const response=await fetch('/api/invitation?token='+encodeURIComponent(token),{headers:{Accept:'application/json'},cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||'No pudimos abrir esta invitación.');applyInvitation(data.invitation);return}catch(error){alertMessage(error.message,true);return}}for(let attempt=0;attempt<50;attempt++){const value=getParentInvitation();if(value){applyInvitation(value);return}await new Promise(resolve=>setTimeout(resolve,200))}}
    attendance.addEventListener('change',toggleAttendance);people.addEventListener('change',()=>renderAttendees(Array.from(document.querySelectorAll('.attendee-name')).map(input=>input.value)));
    form.addEventListener('submit',async event=>{event.preventDefault();const attending=attendance.value==='si',names=Array.from(document.querySelectorAll('.attendee-name')).map(input=>input.value.trim());if(!nameInput.value.trim())return alertMessage('Completa el nombre de la invitación.',true);if(!attendance.value)return alertMessage('Selecciona si asistirás.',true);if(attending&&names.some(name=>!name))return alertMessage('Completa el nombre de todas las personas que asistirán.',true);const token=parentToken();submitButton.disabled=true;submitButton.textContent='Guardando confirmación…';try{if(!token){throw new Error('Este es un enlace anterior. Solicita el nuevo enlace personalizado para registrar la confirmación en el panel.')}const response=await fetch('/api/invitation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,attendance:attending,attendeeCount:attending?Number(people.value):0,attendeeNames:attending?names:[],message:messageInput.value.trim()})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'No pudimos guardar la confirmación.');alertMessage(data.whatsappUrl?'Confirmación guardada. Abriendo WhatsApp…':'Confirmación guardada. Falta configurar el número de WhatsApp.',!data.whatsappUrl);document.getElementById('savedNote').classList.remove('hidden');if(data.whatsappUrl)setTimeout(()=>{if(window.top&&window.top!==window.self)window.top.location.href=data.whatsappUrl;else window.location.href=data.whatsappUrl},650)}catch(error){alertMessage(error.message,true)}finally{submitButton.disabled=false;submitButton.textContent='Guardar y confirmar por WhatsApp'}});
    if(window.ResizeObserver)new ResizeObserver(reportHeight).observe(card);else new MutationObserver(reportHeight).observe(card,{childList:true,subtree:true,attributes:true});
    window.addEventListener('load',reportHeight);reportHeight();waitForInvitation();
  </script>
</body>
</html>
